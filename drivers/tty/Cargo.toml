[package]
name = "minixrs-tty"
version = "0.1.0"
edition = "2024"
license = "BSD-3-Clause"
publish = false

# The renderer (slice 6.7, F6): `font`, `grid`, `paint` and `reply` — pure, `unsafe`-free and
# host-tested. There is deliberately **no feature gate** between the two halves, unlike
# `fs/mfs`: nothing reaches this library from a build script, so the bin stays visible to
# every CI job. `tools/fbcheck` depends on it to decode a screen dump with the code that
# painted it.
[lib]
name = "minixrs_tty"
path = "src/lib.rs"

# `name` must equal the package name: `build_server` in `kernel/build.rs` looks the ELF up
# by that basename.
[[bin]]
name = "minixrs-tty"
path = "src/main.rs"

# `minixrs-driver-rt` supplies `IrqLine`, the claim / re-arm helper shared with the virtio
# drivers, and `cdev`, the pure half of the `CDEV_READ` contract shared with `virtio-console`;
# its `src` is on the shared `rerun-if-changed` list in `kernel/build.rs`.
[dependencies]
minixrs-kernel-shared = { path = "../../kernel-shared" }
minixrs-ipc = { path = "../../minixrs-ipc" }
minixrs-server-rt = { path = "../../server-rt" }
minixrs-driver-rt = { path = "../driver-rt" }
minixrs-abi-note = { path = "../../minixrs-abi-note" }

[lints]
workspace = true
