name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same ref (e.g. new push to a PR branch).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Install pinned toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Install pinned toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      # minixrs-kernel would build fine here (forced-target cross-compiles it),
      # but doing so on this x86 runner means clang cross-assembling the .S
      # files plus 8 nested server builds on a blocking gate. Exclude it for
      # cost, not correctness: clippy-kernel below lints it natively on arm64,
      # and a local `cargo clippy --workspace` does lint it.
      - run: cargo clippy --workspace --exclude minixrs-kernel --all-targets -- -D warnings
      # The MFS *server* is a `[[bin]]` with `required-features = ["server"]`, so
      # the sweep above silently skips it — as do miri and coverage, none of which
      # passes the feature. Without this step the only thing in CI that compiles
      # `fs/mfs/src/main.rs` at all is the qemu-smoke boot, which would report a
      # lint failure as a mysterious build-script panic. Slice 5.8; see the note
      # in fs/mfs/Cargo.toml for the rest of the mitigation.
      - run: cargo clippy -p minixrs-mfs --features server --all-targets -- -D warnings

  clippy-kernel:
    name: clippy (kernel aarch64)
    # Native arm64 so the kernel's .S files assemble without a cross toolchain
    # (same reason qemu-smoke uses this runner).
    runs-on: ubuntu-24.04-arm
    # Blocking: the kernel is excluded from the host gates above (for runner
    # cost), so this job is the only CI job that lints and compiles kernel
    # code. The dated nightly pin in rust-toolchain.toml means a new lint can
    # only appear on a deliberate bump, so this can't red-X an unrelated PR.
    # It also proves the unstable `per-package-target` feature still resolves.
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Install pinned toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      # No --all-targets: the kernel is no_std/no_main, so there is no test
      # harness to build.
      - name: clippy (default features, stubs A–D on)
        run: cargo clippy -p minixrs-kernel --target aarch64-unknown-none -- -D warnings
      # The stub-free boot (phase-5-prep chunk 3) is a supported configuration;
      # nothing else in CI compiles it. Two #[allow]s live only inside
      # cfg(feature = "boot-stubs") code, so this run covers a distinct surface.
      - name: clippy (--no-default-features, stub-free)
        run: |
          cargo clippy -p minixrs-kernel --target aarch64-unknown-none \
            --no-default-features -- -D warnings

  c-headers:
    name: generated C headers
    runs-on: ubuntu-latest
    # Blocking (phase-5 decision D8): the generated headers are the musl fork's
    # only view of the minix.rs ABI, and they are never committed — so a Rust
    # change that produces uncompilable C has to fail in the slice that made it,
    # not in slice 5.6 when the first C file appears.
    #
    # No clang install step: kernel/build.rs already shells out to bare `clang`
    # to assemble the kernel's .S files, so it is an existing hard build
    # requirement that the runner images satisfy.
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Install pinned toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Generate headers
        run: cargo gen-c-headers
      # -nostdlibinc (clang-only; do not "portably" swap in cc) plus
      # -ffreestanding keeps the check hermetic: the selftest sees ONLY the
      # generated headers and clang's own resource-dir headers, so it cannot
      # accidentally validate against the host libc — whose errno values differ
      # from musl's (Darwin EDEADLK is 11, not 35). Three triples: the host
      # proves portability, the two musl triples are what actually ships.
      # -fsyntax-only needs no backend, no linker, and no sysroot.
      - name: Syntax-check the generated headers
        run: |
          for target in "" "--target=aarch64-unknown-linux-musl" \
                           "--target=x86_64-unknown-linux-musl"; do
            clang -std=c11 -pedantic-errors -Wall -Wextra -Werror \
              -fsyntax-only -ffreestanding -nostdlibinc $target \
              -Itarget/gen-c-headers/include \
              target/gen-c-headers/abi-selftest.c
          done
      # Compiles <minixrs/errno.h>'s opt-in POSIX block against the generated
      # stand-in. A syntax and macro-spelling check only — the stand-in is
      # generated from the same Rust table the assertions check. The real value
      # check runs against the musl fork's bits/errno.h in tools/build-musl.sh,
      # on the qemu-smoke job (slice 5.6).
      - name: Syntax-check the opt-in errno assertions
        run: |
          clang -std=c11 -pedantic-errors -Wall -Wextra -Werror \
            -fsyntax-only -ffreestanding -nostdlibinc \
            --target=aarch64-unknown-linux-musl \
            -DMINIXRS_ABI_CHECK_POSIX_ERRNO \
            -Itarget/gen-c-headers/abi-check \
            -Itarget/gen-c-headers/include \
            target/gen-c-headers/abi-selftest.c
      # D8: the headers are build artifacts under target/ and are never
      # committed. Makes that rule mechanical rather than a convention.
      - name: Assert nothing was written into the tree
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"

  audit:
    name: cargo-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: taiki-e/install-action@fd2f5e3d644b484055ebf4268f474c565f148f25 # v2
        with:
          tool: cargo-audit
      - run: cargo audit

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: taiki-e/install-action@fd2f5e3d644b484055ebf4268f474c565f148f25 # v2
        with:
          tool: cargo-deny
      - run: cargo deny check

  dco:
    name: DCO sign-off
    runs-on: ubuntu-latest
    # PR-only. A push to main lands a GitHub merge commit, which by design
    # carries no sign-off (CLAUDE.md "Commits"), so there is nothing to check
    # there -- and the authored commits underneath were already checked on the
    # PR that introduced them.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # The check walks base..head, so the default shallow clone is not
          # enough: it needs both endpoints and everything between them.
          fetch-depth: 0
      # SHAs go through the environment rather than being interpolated into the
      # script -- the standard guard against expression injection from event
      # payload fields, cheap to keep right even where the field is hex.
      - name: Check every PR commit is signed off
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: tools/check-dco.sh "$BASE_SHA..$HEAD_SHA"

  geiger:
    name: cargo-geiger (advisory)
    runs-on: ubuntu-latest
    # Advisory: cargo-geiger frequently fails to build on bleeding-edge nightly /
    # edition 2024, so a tooling breakage must not red-X the PR.
    continue-on-error: true
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Install pinned toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - uses: taiki-e/install-action@fd2f5e3d644b484055ebf4268f474c565f148f25 # v2
        with:
          tool: cargo-geiger
      # cargo-geiger rejects the virtual workspace root, so scan each member
      # package individually. The report is advisory, so a per-crate failure
      # (e.g. a no_std crate geiger can't build on host) must not abort the sweep.
      # minixrs-kernel is filtered out: it is bare-metal only and its build
      # script hard-errors on a host target, so scanning it is guaranteed noise.
      - name: Scan unsafe usage per package
        run: |
          for pkg in $(cargo metadata --no-deps --format-version 1 \
              | jq -r '.packages[].name' | grep -v '^minixrs-kernel$'); do
            echo "::group::geiger $pkg"
            cargo geiger --package "$pkg" || echo "geiger failed for $pkg (advisory)"
            echo "::endgroup::"
          done

  miri:
    name: miri (advisory)
    runs-on: ubuntu-latest
    # Advisory: miri may be unavailable for the very latest nightly, and only the
    # pure crates below are testable under it (minixrs-ipc uses inline asm).
    continue-on-error: true
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Install pinned toolchain + miri
        run: |
          rustup show
          rustup component add miri
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      # `minixrs-tty` qualifies despite owning volatile MMIO: its only `unsafe`
      # lives in `pl011.rs`, which no test reaches — the measured logic is
      # `cdev.rs`'s pure parse/validate.
      - run: >
          cargo miri test
          -p minixrs-kernel-shared -p minixrs-vm -p minixrs-pm -p minixrs-tty
          -p minixrs-mfs -p minixrs-mkfs-mfs -p minixrs-memory

  qemu-smoke:
    name: QEMU boot smoke
    # Free arm64 runner for public repos; native-ISA TCG (no KVM available).
    runs-on: ubuntu-24.04-arm
    # Blocking as of phase-5-prep chunk 7: it stayed green across PRs #33–#37,
    # satisfying chunk 1's "stable across a few PRs" bar. Keep the expectations
    # in tests/qemu-boot.expected timing-robust (first occurrences, never
    # counts) — shared-runner TCG timing is the flake risk.
    timeout-minutes: 30
    steps:
      # submodules: external/musl is the musl fork (slice 5.6). Without it
      # kernel/build.rs falls back to packing `worker` as `hello` and the C
      # markers go missing — so the checkout must be recursive or this job
      # silently stops testing the thing it exists to test.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          submodules: recursive
      - name: Install pinned toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Install QEMU + aarch64 UEFI firmware
        run: |
          sudo apt-get update
          # ipxe-qemu ships efi-virtio.rom, which QEMU needs for the virtio ESP
          # drive; it is a Recommends skipped by --no-install-recommends.
          sudo apt-get install -y --no-install-recommends qemu-system-arm qemu-efi-aarch64 ipxe-qemu
          qemu-system-aarch64 --version
      - name: Fetch Limine bootloader (pinned commit)
        run: make -C external/limine
      # The musl sysroot is expensive (a full libc build) and changes only when
      # the submodule or the toolchain does — exactly what the key covers.
      # tools/build-musl.sh writes the same identity into target/musl-sysroot/
      # .stamp and re-uses the tree when it matches, so a cache hit makes the
      # build step below a no-op.
      #
      # Keyed on the submodule's resolved COMMIT, not on a tracked file: the
      # port branch is force-pushed on rebase, so external/musl/VERSION would
      # stay identical across a port change and serve a stale sysroot.
      - name: Resolve musl submodule commit
        id: musl
        run: echo "sha=$(git -C external/musl rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Cache musl sysroot
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: target/musl-sysroot
          key: musl-sysroot-${{ runner.os }}-${{ runner.arch }}-${{ steps.musl.outputs.sha }}-${{ hashFiles('rust-toolchain.toml', 'tools/build-musl.sh') }}
      # No new tooling to install: clang is already a hard build requirement
      # (build.rs assembles the kernel's .S files with it) and llvm-ar ships
      # with the pinned Rust toolchain.
      - name: Build the musl sysroot
        run: tools/build-musl.sh
      - name: Build kernel
        run: cargo kernel-aarch64
      - name: Boot in QEMU (120 s wall clock)
        env:
          QEMU_EFI_AARCH64: /usr/share/qemu-efi-aarch64/QEMU_EFI.fd
        run: |
          # The kernel runs forever (WFE idle); timeout(1) is the terminator,
          # so exit 124 is the *only* healthy status. Any other status means
          # the build, the runner, or QEMU itself failed — fail here rather
          # than letting the log checker report a confusing missing-marker
          # error. The checker step below is the verdict on log content.
          status=0
          # 45 s until slice 5.9. exec-from-FS made the boot genuinely longer:
          # `hello` is no longer a memcpy out of the boot archive but ~200 KB
          # read off the ramdisk through MFS and VFS, one FS_MAX_IO round at a
          # time, before the first C marker can appear. Locally the last marker
          # moved from ~27% to ~71% of a 45 s run; CI's TCG is slower than local,
          # so the budget is raised with real headroom rather than trimmed to
          # what passes here. The job's own `timeout-minutes` still bounds it.
          timeout 120 cargo run -p minixrs-kernel --target aarch64-unknown-none --release \
            > qemu.log 2>&1 || status=$?
          echo "qemu run finished with status $status (124 = timeout, expected)"
          if [ "$status" -ne 124 ]; then
            echo "::error::expected exit 124 (timeout); got $status — see the qemu-boot-log artifact"
            exit 1
          fi
      - name: Check boot log
        run: tools/check-boot-log.sh qemu.log
      - name: Upload boot log
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: qemu-boot-log
          path: qemu.log
          if-no-files-found: error

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Install pinned toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - uses: taiki-e/install-action@fd2f5e3d644b484055ebf4268f474c565f148f25 # v2
        with:
          tool: cargo-llvm-cov
      # minixrs-kernel is bare-metal only: it has no tests and cannot be
      # instrumented on the host. QEMU is its verification; the clippy-kernel
      # job is its compile gate.
      - name: Generate LCOV coverage
        run: cargo llvm-cov --workspace --exclude minixrs-kernel --lcov --output-path lcov.info
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lcov
          path: lcov.info
          if-no-files-found: error

  sonar:
    name: SonarCloud
    runs-on: ubuntu-latest
    needs: coverage
    # SONAR_TOKEN is not exposed to PRs from forks; skip there instead of failing.
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # Full history so SonarCloud can attribute issues to commits/authors.
          fetch-depth: 0
      - name: Download coverage report
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: lcov
          path: .
      - name: SonarQube Cloud scan
        uses: SonarSource/sonarqube-scan-action@713881670b6b3676cda39549040e2d88c70d582e # v8.2.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
