[package]
name = "minixrs-virtio-console"
version = "0.1.0"
edition = "2024"
license = "BSD-3-Clause"
publish = false

[[bin]]
name = "minixrs-virtio-console"
path = "src/main.rs"

# `minixrs-driver-rt` supplies the virtio-mmio transport, `negotiate`, the split
# virtqueue, the DMA handles and `IrqLine`. `minixrs-ipc` and `minixrs-server-rt`
# are for the device-touching half of `main.rs`.
[dependencies]
minixrs-kernel-shared = { path = "../../kernel-shared" }
minixrs-ipc = { path = "../../minixrs-ipc" }
minixrs-server-rt = { path = "../../server-rt" }
minixrs-driver-rt = { path = "../driver-rt" }
minixrs-abi-note = { path = "../../minixrs-abi-note" }

[lints]
workspace = true
