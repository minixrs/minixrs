name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same ref (e.g. new push to a PR branch).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Every formatting/shape gate that needs no build. The job keeps the name
  # `rustfmt` because that is what branch protection requires; it now also
  # covers markdown formatting and markdown link integrity, both of which are
  # cheap enough that a twelfth blocking job would be pure overhead.
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Install pinned toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo fmt --all --check
      # dprint is fetched as a pinned release asset and checksum-verified
      # before it runs. Never `curl | sh`: that executes whatever the server
      # serves, with no way to notice it changed. The version is pinned the way
      # every other tool here is -- dprint.json already pins the markdown plugin
      # by checksum, but the CLI decides how config is resolved, so a floating
      # CLI could still move the output from under a checksum-pinned plugin.
      #
      # DPRINT_SHA256 was computed from the downloaded bytes, not copied from
      # the publisher's SHASUMS256.txt -- taking the digest from the same server
      # as the artifact would verify nothing. Bump the two together.
      #
      # `dprint/check-action` would install it too, at the cost of another
      # third-party action to SHA-pin, and it would still fetch the binary the
      # same way.
      - name: Install dprint (pinned + checksum-verified)
        env:
          DPRINT_VERSION: 0.57.4
          DPRINT_SHA256: 1d26357d8bc66898d4ecc7dafca3d2971cfe222ba487228bd2ce5c3b3a309c33
        run: |
          set -euo pipefail
          # --proto/--proto-redir pin both the initial request and every
          # redirect to https; a release asset redirects to the object store.
          curl --proto '=https' --proto-redir '=https' --tlsv1.2 -sSfL \
            -o /tmp/dprint.zip \
            "https://github.com/dprint/dprint/releases/download/${DPRINT_VERSION}/dprint-x86_64-unknown-linux-gnu.zip"
          echo "${DPRINT_SHA256}  /tmp/dprint.zip" | sha256sum -c -
          mkdir -p "$HOME/.dprint/bin"
          unzip -q -o /tmp/dprint.zip -d "$HOME/.dprint/bin"
          chmod +x "$HOME/.dprint/bin/dprint"
          echo "$HOME/.dprint/bin" >> "$GITHUB_PATH"
      - name: Check markdown formatting
        run: dprint check
      # Formatting alone does not keep a cross-reference honest: a rule with one
      # home is only reachable while the pointers at it resolve. This checks that
      # every relative markdown link names a file that exists and, when it carries
      # a fragment, a heading that really renders to that anchor.
      #
      # The self-test runs first and on purpose: it asserts the check FAILS on
      # each breakage it exists to catch. A gate nobody has watched fail reads as
      # coverage without being any.
      - name: Self-test the markdown link checker
        run: python3 tools/check-md-links.py --self-test
      - name: Check markdown links and anchors
        run: python3 tools/check-md-links.py

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Install pinned toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      # minixrs-kernel would build fine here (forced-target cross-compiles it),
      # but doing so on this x86 runner means clang cross-assembling the .S
      # files plus 8 nested server builds on a blocking gate. Exclude it for
      # cost, not correctness: clippy-kernel below lints it natively on arm64,
      # and a local `cargo clippy --workspace` does lint it.
      - run: cargo clippy --workspace --exclude minixrs-kernel --all-targets -- -D warnings
      # The MFS *server* is a `[[bin]]` with `required-features = ["server"]`, so
      # the sweep above silently skips it — as do miri and coverage, none of which
      # passes the feature. Without this step the only thing in CI that compiles
      # `fs/mfs/src/main.rs` at all is the qemu-smoke boot, which would report a
      # lint failure as a mysterious build-script panic. Slice 5.8; see the note
      # in fs/mfs/Cargo.toml for the rest of the mitigation.
      - run: cargo clippy -p minixrs-mfs --features server --all-targets -- -D warnings

  clippy-kernel:
    name: clippy (kernel aarch64)
    # Native arm64 so the kernel's .S files assemble without a cross toolchain
    # (same reason qemu-smoke uses this runner).
    runs-on: ubuntu-24.04-arm
    # Blocking: the kernel is excluded from the host gates above (for runner
    # cost), so this job is the only CI job that lints and compiles kernel
    # code. The dated nightly pin in rust-toolchain.toml means a new lint can
    # only appear on a deliberate bump, so this can't red-X an unrelated PR.
    # It also proves the unstable `per-package-target` feature still resolves.
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Install pinned toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      # No --all-targets: the kernel is no_std/no_main, so there is no test
      # harness to build.
      - name: clippy (default features, stubs A–D on)
        run: cargo clippy -p minixrs-kernel --target aarch64-unknown-none -- -D warnings
      # The stub-free boot (phase-5-prep chunk 3) is a supported configuration;
      # nothing else in CI compiles it. Two #[allow]s live only inside
      # cfg(feature = "boot-stubs") code, so this run covers a distinct surface.
      - name: clippy (--no-default-features, stub-free)
        run: |
          cargo clippy -p minixrs-kernel --target aarch64-unknown-none \
            --no-default-features -- -D warnings

  c-headers:
    name: generated C headers
    runs-on: ubuntu-latest
    # Blocking (phase-5 decision D8): the generated headers are the musl fork's
    # only view of the minix.rs ABI, and they are never committed — so a Rust
    # change that produces uncompilable C has to fail in the slice that made it,
    # not in slice 5.6 when the first C file appears.
    #
    # No clang install step: kernel/build.rs already shells out to bare `clang`
    # to assemble the kernel's .S files, so it is an existing hard build
    # requirement that the runner images satisfy.
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Install pinned toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Generate headers
        run: cargo gen-c-headers
      # -nostdlibinc (clang-only; do not "portably" swap in cc) plus
      # -ffreestanding keeps the check hermetic: the selftest sees ONLY the
      # generated headers and clang's own resource-dir headers, so it cannot
      # accidentally validate against the host libc — whose errno values differ
      # from musl's (Darwin EDEADLK is 11, not 35). Three triples: the host
      # proves portability, the two musl triples are what actually ships.
      # -fsyntax-only needs no backend, no linker, and no sysroot.
      - name: Syntax-check the generated headers
        run: |
          for target in "" "--target=aarch64-unknown-linux-musl" \
                           "--target=x86_64-unknown-linux-musl"; do
            clang -std=c11 -pedantic-errors -Wall -Wextra -Werror \
              -fsyntax-only -ffreestanding -nostdlibinc $target \
              -Itarget/gen-c-headers/include \
              target/gen-c-headers/abi-selftest.c
          done
      # Compiles <minixrs/errno.h>'s opt-in POSIX block against the generated
      # stand-in. A syntax and macro-spelling check only — the stand-in is
      # generated from the same Rust table the assertions check. The real value
      # check runs against the musl fork's bits/errno.h in tools/build-musl.sh,
      # on the qemu-smoke job (slice 5.6).
      - name: Syntax-check the opt-in errno assertions
        run: |
          clang -std=c11 -pedantic-errors -Wall -Wextra -Werror \
            -fsyntax-only -ffreestanding -nostdlibinc \
            --target=aarch64-unknown-linux-musl \
            -DMINIXRS_ABI_CHECK_POSIX_ERRNO \
            -Itarget/gen-c-headers/abi-check \
            -Itarget/gen-c-headers/include \
            target/gen-c-headers/abi-selftest.c
      # D8: the headers are build artifacts under target/ and are never
      # committed. Makes that rule mechanical rather than a convention.
      - name: Assert nothing was written into the tree
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"

  audit:
    name: cargo-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: taiki-e/install-action@fd2f5e3d644b484055ebf4268f474c565f148f25 # v2
        with:
          tool: cargo-audit
      - run: cargo audit

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: taiki-e/install-action@fd2f5e3d644b484055ebf4268f474c565f148f25 # v2
        with:
          tool: cargo-deny
      - run: cargo deny check

  dco:
    name: DCO sign-off
    runs-on: ubuntu-latest
    # PR-only. A push to main lands a GitHub merge commit, which by design
    # carries no sign-off (docs/conventions/git-and-prs.md "Commits"), so
    # there is nothing to check there -- and the authored commits underneath
    # were already checked on the PR that introduced them.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # The check walks base..head, so the default shallow clone is not
          # enough: it needs both endpoints and everything between them.
          fetch-depth: 0
      # SHAs go through the environment rather than being interpolated into the
      # script -- the standard guard against expression injection from event
      # payload fields, cheap to keep right even where the field is hex.
      - name: Check every PR commit is signed off
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: tools/check-dco.sh "$BASE_SHA..$HEAD_SHA"

  geiger:
    name: cargo-geiger (advisory)
    runs-on: ubuntu-latest
    # Advisory: cargo-geiger frequently fails to build on bleeding-edge nightly /
    # edition 2024, so a tooling breakage must not red-X the PR.
    continue-on-error: true
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Install pinned toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - uses: taiki-e/install-action@fd2f5e3d644b484055ebf4268f474c565f148f25 # v2
        with:
          tool: cargo-geiger
      # cargo-geiger rejects the virtual workspace root, so scan each member
      # package individually. The report is advisory, so a per-crate failure
      # (e.g. a no_std crate geiger can't build on host) must not abort the sweep.
      # minixrs-kernel is filtered out: it is bare-metal only and its build
      # script hard-errors on a host target, so scanning it is guaranteed noise.
      - name: Scan unsafe usage per package
        run: |
          for pkg in $(cargo metadata --no-deps --format-version 1 \
              | jq -r '.packages[].name' | grep -v '^minixrs-kernel$'); do
            echo "::group::geiger $pkg"
            cargo geiger --package "$pkg" || echo "geiger failed for $pkg (advisory)"
            echo "::endgroup::"
          done

  miri:
    name: miri (advisory)
    runs-on: ubuntu-latest
    # Advisory: miri may be unavailable for the very latest nightly, and only the
    # pure crates below are testable under it (minixrs-ipc uses inline asm).
    continue-on-error: true
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Install pinned toolchain + miri
        run: |
          rustup show
          rustup component add miri
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      # `minixrs-tty` qualifies despite owning volatile MMIO: its only `unsafe`
      # lives in `pl011.rs`, which no test reaches — the measured logic is
      # `cdev.rs`'s pure parse/validate. `minixrs-driver-rt` is here for the
      # opposite reason: its tests drive the virtqueue's `unsafe` ring accesses,
      # which is where Miri caught a write through a shared-borrow pointer.
      # `minixrs-mkimage` is pure and still NOT here: it has no `unsafe` for
      # Miri to check, and its integration tests build whole 37 MiB disk images,
      # which under an interpreter would take a very long time. Its tests run
      # in the `coverage` job, which is workspace-wide.
      - run: >
          cargo miri test
          -p minixrs-kernel-shared -p minixrs-vm -p minixrs-pm -p minixrs-tty
          -p minixrs-mfs -p minixrs-mkfs-mfs -p minixrs-memory
          -p minixrs-driver-rt

  # Decides whether qemu-smoke has anything to prove. A docs-only PR cannot
  # change the boot, and the boot is the slowest gate by far (every one of its
  # three boots always burns its full timeout -- 33 minutes in all as of slice
  # 6.4), so it skips there -- see tools/boot-relevant.sh for what counts as
  # docs-only. Pushes to main always boot.
  #
  # This cannot be a workflow-level `paths-ignore`: "QEMU boot smoke" is a
  # required check, and a workflow that never starts never reports it, so a
  # docs PR would sit pending forever. A job skipped by its `if:` reports
  # success instead, which is what branch protection needs.
  boot-scope:
    name: boot scope
    runs-on: ubuntu-latest
    outputs:
      boot: ${{ steps.scope.outputs.boot }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # The three-dot range needs the merge base, which a shallow clone
          # does not have.
          fetch-depth: 0
      - name: Self-test the classifier
        run: tools/boot-relevant.sh --self-test
      # SHAs and the event name go through the environment rather than being
      # interpolated into the script (expression-injection guard, as in dco).
      - name: Classify the change
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" = pull_request ]; then
            boot=$(tools/boot-relevant.sh "$BASE_SHA...$HEAD_SHA")
          else
            boot=true
          fi
          echo "boot=$boot" | tee -a "$GITHUB_OUTPUT"

  qemu-smoke:
    name: QEMU boot smoke
    needs: boot-scope
    # Boot unless boot-scope *succeeded* and said docs-only. A failed or
    # skipped boot-scope must not skip the boot: a skipped required check
    # reports success, so a broken classifier would otherwise wave every PR
    # through untested. `!cancelled()` stops `needs` from skipping this job
    # when boot-scope fails.
    if: >-
      !cancelled() &&
      (needs.boot-scope.result != 'success' ||
       needs.boot-scope.outputs.boot == 'true')
    # Free arm64 runner for public repos; native-ISA TCG (no KVM available).
    runs-on: ubuntu-24.04-arm
    # Blocking as of phase-5-prep chunk 7: it stayed green across PRs #33–#37,
    # satisfying chunk 1's "stable across a few PRs" bar. Keep the expectations
    # in tests/qemu-boot.expected timing-robust (first occurrences, never
    # counts) — shared-runner TCG timing is the flake risk.
    #
    # This ceiling has to clear the boot step *plus* the build, and the boot step
    # now always burns its full timeout (600 s as of slice 5.10b, up from 240 s —
    # a healthy run is the one that reaches it). On a cold rust-cache the runner
    # still builds the kernel and nine user crates with -Zbuild-std before the
    # first byte. 40 → 50 leaves that headroom: whoever raises the boot timeout
    # again should raise this in the same edit.
    #
    # Slice 6.3 (50 → 65): the job boots TWICE, once per root backend, and each
    # boot burns its full timeout. A second 600 s boot is 10 more minutes; 65
    # keeps the build headroom the 50 was sized for, plus five.
    #
    # Slice 6.4 (65 → 80): the job boots THREE times -- the disk boot, a short
    # reboot of the image that boot wrote, the rootless-disk fallback boot --
    # and the two full boots went from 600 s to 900 s each (the budget comment
    # on the boot step has the measurement). The 65 was 20 minutes of boots
    # plus 45 of build headroom; the boots are now 900 + 180 + 900 = 1980 s =
    # 33 minutes, and 45 + 33 = 78, rounded up to 80. The new host-tool build
    # (tools/mkimage and its one dependency, no build-std) is seconds and lives
    # inside the headroom. Whoever changes any of the three timeouts changes
    # this in the same edit, by the sum of the differences.
    timeout-minutes: 80
    steps:
      # submodules: external/musl is the musl fork (slice 5.6). Without it
      # kernel/build.rs falls back to packing `worker` as `hello` and the C
      # markers go missing — so the checkout must be recursive or this job
      # silently stops testing the thing it exists to test.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          submodules: recursive
      - name: Install pinned toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Install QEMU + aarch64 UEFI firmware
        run: |
          sudo apt-get update
          # ipxe-qemu ships efi-virtio.rom, a Recommends that
          # --no-install-recommends skips. KEPT. Why QEMU on THIS runner wants
          # it has not been established here. This comment used to attribute
          # it to the virtio ESP drive (virtio-blk-PCI), which slice 6.4
          # removed: the runner's one disk is now virtio-blk-device on
          # virtio-mmio. That attribution looks wrong: on a dev machine's QEMU
          # 11.0.3, `info qtree` shows efi-virtio.rom as the romfile of
          # virtio-net-pci -- the NIC `-M virt` creates by default, since the
          # runner passes neither -nodefaults nor -nic none -- and none on
          # virtio-blk-pci. If the runner's QEMU is the same, nothing about the
          # need changed in 6.4. Untested without the package: that takes a CI
          # run made on purpose.
          sudo apt-get install -y --no-install-recommends qemu-system-arm qemu-efi-aarch64 ipxe-qemu
          qemu-system-aarch64 --version
      - name: Fetch Limine bootloader (pinned commit)
        run: make -C external/limine
      # The musl sysroot is expensive (a full libc build) and changes only when
      # the submodule or the toolchain does — exactly what the key covers.
      # tools/build-musl.sh writes the same identity into target/musl-sysroot/
      # .stamp and re-uses the tree when it matches, so a cache hit makes the
      # build step below a no-op.
      #
      # Keyed on the submodule's resolved COMMIT, not on a tracked file: the
      # port branch is force-pushed on rebase, so external/musl/VERSION would
      # stay identical across a port change and serve a stale sysroot.
      - name: Resolve musl submodule commit
        id: musl
        run: echo "sha=$(git -C external/musl rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Cache musl sysroot
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: target/musl-sysroot
          key: musl-sysroot-${{ runner.os }}-${{ runner.arch }}-${{ steps.musl.outputs.sha }}-${{ hashFiles('rust-toolchain.toml', 'tools/build-musl.sh') }}
      # No new tooling to install: clang is already a hard build requirement
      # (build.rs assembles the kernel's .S files with it) and llvm-ar ships
      # with the pinned Rust toolchain.
      - name: Build the musl sysroot
        run: tools/build-musl.sh
      - name: Build kernel
        run: cargo kernel-aarch64
      # tools/mkimage is the HOST tool that writes the boot disk. The cargo
      # runner (tools/qemu-run.sh) builds it through a nested `cargo run
      # --release -p minixrs-mkimage`, which happens INSIDE the boot's
      # `timeout`: on a cold cache that compile would be charged to the first
      # boot's budget and skew the very fraction the budget is derived from.
      # Built here, the nested cargo finds it fresh and only runs it.
      - name: Build the disk-image tool (host)
        run: cargo build --release -p minixrs-mkimage
      # Three boots (slice 6.4; two since 6.3). The machine always boots from ONE
      # disk now: a GPT image written by tools/mkimage, attached as a modern
      # virtio-blk device on virtio-mmio, which the firmware reads the kernel
      # from and the vblk driver then brings up. What is ON the image selects
      # the root (phase decision H5):
      #
      #   disk     the image carries the ESP and the root partition; vblk finds
      #            the root by its GPT type and MFS mounts through it.
      #   reboot   the image the disk boot just WROTE TO, attached as-is with no
      #            rebuild (MINIXRS_VBLK_IMAGE=target/disk.img). It must print
      #            `persist gen=1` -- a write that survived into a second boot,
      #            which the ramdisk could never show. Short: it runs only until
      #            that line and is checked against its own marker pair.
      #   ramdisk  the same image WITHOUT the root partition. A disk is still
      #            attached (the firmware needs somewhere to read the kernel
      #            from); vblk brings it up, finds no root partition, and MFS
      #            falls back to the ramdisk. This is the no-root fallback boot,
      #            and it keeps the ramdisk root green for the whole phase (H7).
      #
      # No boot here attaches no disk at all, and none uses virtio-blk-PCI: that
      # is MINIXRS_ROOT=nodisk, hand-run only.
      #
      # The reboot comes IMMEDIATELY after the disk boot, before anything else
      # runs. Every disk boot REBUILDS target/disk.img, so the image the reboot
      # needs exists only between that boot and the next one of its kind. The
      # ramdisk boot writes a different file (target/disk-rootless.img) and
      # would not destroy it today, but the order should not depend on that
      # staying true.
      #
      # Sequential in ONE job, not a matrix: a matrix would rename the required
      # "QEMU boot smoke" check and two QEMUs on one runner would starve each
      # other. Each full boot is checked against the common marker lists plus
      # its own backend's (tools/check-boot-log.sh), then tools/diff-backends.sh
      # proves the filesystem's output is the same on both.
      #
      # NOT YET MEASURED ON THIS RUNNER (slice 6.4): that Debian's QEMU_EFI.fd
      # boots from a modern (version 2) virtio-mmio disk and reads the FAT32
      # that tools/mkimage writes. Both were measured only against Homebrew's
      # edk2 under QEMU 11.0.3. The first CI run of the 6.4 branch IS the
      # measurement: if this firmware cannot, the disk boot's log holds no
      # kernel banner at all (only the firmware's boot-failure output) and the
      # checker reports every marker missing. The fallback recorded in
      # docs/plans/phase-6-virtio.md is a second, firmware-only attachment of
      # the same image.
      - name: Boot in QEMU — disk, a reboot of that image, the rootless-disk fallback
        env:
          QEMU_EFI_AARCH64: /usr/share/qemu-efi-aarch64/QEMU_EFI.fd
        run: |
          # The kernel runs forever (WFE idle); timeout(1) is the terminator,
          # so exit 124 is the *only* healthy status. Any other status means
          # the build, the runner, or QEMU itself failed — fail here rather
          # than letting the log checker report a confusing missing-marker
          # error. The checker step below is the verdict on log content.
          #
          # 45 s until slice 5.9, 120 s until slice 5.10a, 240 s until slice
          # 5.10b. Every raise was the same story: a slice made the boot
          # genuinely longer, and the budget was raised with real headroom
          # rather than trimmed to whatever passes locally. The job's own
          # `timeout-minutes` still bounds it.
          #
          # 5.9 (45 -> 120): `hello` stopped being a memcpy out of the boot
          # archive and became ~200 KB read off the ramdisk through MFS and VFS,
          # one FS_MAX_IO round at a time, before the first C marker can appear.
          #
          # 5.10a (120 -> 240): init now writes 32 KiB to /etc/scratch and reads
          # every byte of it back, which is ~130 more device round trips plus the
          # zone-allocation and inode write-back traffic underneath them. Measured
          # the repo's way — `grep -abo` the last required marker, divide by
          # `wc -c` — on the **musl** flavour, the one this job builds, at a fixed
          # 120 s: the last marker (`hello: errno ok`) moved from 27.98% to
          # 56.20% of the log, i.e. the boot roughly DOUBLED (~34 s -> ~67 s wall
          # on the dev machine). At 120 s that left a safety factor of only 1.78x
          # over local, which is inside the plausible range for how much slower
          # this shared arm64 runner's TCG is. 240 s restored the pre-slice 3.56x.
          #
          # 5.10b (240 -> 600): the leak-fix regression probe issues 256 extra
          # failing FS_WRITEs (each one a doomed grant + BDEV round trip) plus
          # one good one, all before the last required marker. Measured the same
          # way, at a fixed 240 s, on the same dev machine: the last marker
          # (`hello: errno ok`) moved from 26.90% to 61.61% of the log — a 2.29x
          # jump, comparable in kind to the 5.9 and 5.10a raises. That left a
          # safety factor of only 1.62x at 240 s (below the 1.78x that forced the
          # previous raise), so 600 s restores it to ~4.1x.
          #
          # 6.3 (600 kept, now twice): the disk boot completes every block request
          # by a real interrupt instead of a memcpy. Measured the same way at a
          # fixed 300 s: the last required marker sits at 66.8% of the disk
          # boot's log, against 48.1% for the ramdisk boot of the same build and
          # 48.1% / 55.7% for two boots of the merge base. That is ~200 s local
          # for the slower backend, a 3.0x factor under 600 s -- well above the
          # 1.6-1.8x that forced the earlier raises -- so the per-boot budget
          # stays and only the job's `timeout-minutes` grew.
          #
          # 6.4 (600 -> 900 for the two full boots, plus a 180 s reboot): the
          # machine boots from one GPT disk, and two things got slower. Every
          # write to the disk is now followed by a FLUSH, a second interrupt
          # round trip per write; and the ramdisk boot is no longer device-free
          # -- it brings the rootless disk up and falls back -- while both boots
          # gained the persistence probe and MFS's whole-disk probe. Measured
          # the same way at a fixed 300 s (dev machine, QEMU 11.0.3): the last
          # required marker (`[diag vfs] pm-exit reset closed=1`) sits at
          # 82.0-82.7% of the disk boot's log across three boots of the final
          # code (82.00%, 82.71%, 82.68%: ~246-248 s) and 59.30% of the ramdisk
          # boot's (~178 s), against 66.8% / 48.1% on the merge base. Under
          # 600 s that is a 2.42x factor for the disk boot -- no longer the
          # 3.0x that let 6.3 keep the budget, and heading for the 1.6-1.8x
          # that forced the earlier raises -- and 900 s was chosen to restore
          # 3.63x (5.06x for the ramdisk boot). One number for both full
          # boots, budgeted for the slower. Two earlier disk boots of the
          # slice read 74.89% and 68.43%, on code that was not yet final.
          #
          # THOSE READINGS ARE THE WRONG FLAVOUR -- found in the slice's review
          # round, after the number above was chosen. Every boot of the slice
          # ran with the minix.rs SDK installed and MINIXRS_SDK unset, so its
          # `hello` was the SDK's 46 696 bytes, not the 234 280-byte in-tree
          # musl `hello` THIS job builds, which is the flavour the method
          # above requires. The one musl reading (2026-11-22, same machine,
          # taken at 450 s -- a fraction of a 450 s log is not comparable with
          # a fraction of a 300 s one, so compare seconds): the last required
          # marker at 88.03% of the disk boot's log, ~396 s, and 57.87% of the
          # ramdisk boot's, ~260 s. Against that, 900 s is 2.27x for the
          # disk boot (3.46x for the ramdisk boot), not 3.63x. 900 was NOT
          # re-derived in that round: it is one reading, and the first run of
          # this job is the measurement that settles it. If the disk boot
          # ends here with its markers missing from some point to the end of
          # the boot, suspect this before a regression, and raise the two
          # full boots and `timeout-minutes` together.
          #
          # The reboot needs one line, `minix.rs init: persist gen=1`, and is
          # checked for nothing after it. In a 120 s local reboot that line is
          # at 24.36% of the log (~29 s of guest run), and ~34 s of wall clock
          # from the start of `cargo run`; 45 s passed locally twice. 180 s is
          # 5.3x the 34 s -- rounded up past the full boots' factor on purpose,
          # because a short boot's fixed costs (cargo's start-up, the firmware,
          # Limine) are a larger share of it and do not scale the way guest
          # work does.
          #
          # If you change any of these, re-measure the fraction rather than
          # reasoning from the wall-clock numbers above: they are ratios
          # against a local run, not CI timings. And change the job's
          # `timeout-minutes` in the same edit.
          #
          # $1 names the boot, $2 is its exit status.
          expect_timeout() {
            echo "$1 boot finished with status $2 (124 = timeout, expected)"
            if [ "$2" -ne 124 ]; then
              echo "::error::$1 boot: expected exit 124 (timeout); got $2 — see the qemu-boot-log artifact"
              exit 1
            fi
          }

          status=0
          MINIXRS_ROOT=disk timeout 900 cargo run -p minixrs-kernel \
            --target aarch64-unknown-none --release \
            > qemu-disk.log 2>&1 || status=$?
          expect_timeout disk "$status"

          # The image the disk boot left behind, attached as-is: the runner
          # builds nothing and the boot's writes land in the same file. Nothing
          # may run between the boot above and this one that rebuilds
          # target/disk.img.
          status=0
          MINIXRS_ROOT=disk MINIXRS_VBLK_IMAGE=target/disk.img \
            timeout 180 cargo run -p minixrs-kernel \
            --target aarch64-unknown-none --release \
            > qemu-reboot.log 2>&1 || status=$?
          expect_timeout reboot "$status"

          status=0
          MINIXRS_ROOT=ramdisk timeout 900 cargo run -p minixrs-kernel \
            --target aarch64-unknown-none --release \
            > qemu-ramdisk.log 2>&1 || status=$?
          expect_timeout ramdisk "$status"
      # All three logs are checked even if an earlier one fails, so one run
      # shows the whole story; the step fails if any does. `reboot` is checked
      # against its own marker pair only (tools/check-boot-log.sh says why).
      - name: Check boot logs
        run: |
          rc=0
          tools/check-boot-log.sh disk qemu-disk.log || rc=1
          tools/check-boot-log.sh reboot qemu-reboot.log || rc=1
          tools/check-boot-log.sh ramdisk qemu-ramdisk.log || rc=1
          exit "$rc"
      - name: Compare the two backends
        run: |
          tools/diff-backends.sh --self-test
          tools/diff-backends.sh qemu-disk.log qemu-ramdisk.log
      - name: Upload boot log
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: qemu-boot-log
          path: |
            qemu-disk.log
            qemu-reboot.log
            qemu-ramdisk.log
          if-no-files-found: error

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Install pinned toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - uses: taiki-e/install-action@fd2f5e3d644b484055ebf4268f474c565f148f25 # v2
        with:
          tool: cargo-llvm-cov
      # minixrs-kernel is bare-metal only: it has no tests and cannot be
      # instrumented on the host. QEMU is its verification; the clippy-kernel
      # job is its compile gate.
      - name: Generate LCOV coverage
        run: cargo llvm-cov --workspace --exclude minixrs-kernel --lcov --output-path lcov.info
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lcov
          path: lcov.info
          if-no-files-found: error

  sonar:
    name: SonarCloud
    runs-on: ubuntu-latest
    needs: coverage
    # SONAR_TOKEN is not exposed to PRs from forks; skip there instead of failing.
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # Full history so SonarCloud can attribute issues to commits/authors.
          fetch-depth: 0
      - name: Download coverage report
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: lcov
          path: .
      - name: SonarQube Cloud scan
        uses: SonarSource/sonarqube-scan-action@713881670b6b3676cda39549040e2d88c70d582e # v8.2.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
